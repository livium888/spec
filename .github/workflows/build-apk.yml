name: Build signed APK

# Builds on every push to main or a ccr-* branch (so each update yields a new APK
# signed with the same key), and can also be run by hand from the Actions tab.
on:
  push:
    branches: [main, 'ccr-**']
  workflow_dispatch:

# A newer push cancels an older build still running, so only the latest one finishes.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # to publish the APK as a release asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require signing secrets (a debug-signed APK would force an uninstall)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KS" ] || [ -z "$KP" ] || [ -z "$KA" ]; then
            echo "::error::Missing KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_PASSWORD / KEY_ALIAS secrets."; exit 1
          fi

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Decode keystore
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build release APK (versionCode = run number, so updates install over old ones)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        # arm64 only: every Android phone of the last several years is 64-bit, and one ABI
        # roughly halves the download. Build number and commit are shown in Settings > Diagnostics.
        run: >
          flutter build apk --release --target-platform android-arm64
          --build-number=${{ github.run_number }}
          --dart-define=BUILD_NUMBER=${{ github.run_number }}
          --dart-define=GIT_SHA=${{ github.sha }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: daily-learning-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish to rolling release (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk daily-learning.apk
          # Never delete the release (a cancelled run would leave nothing to download):
          # create it once, then replace the file and the title.
          gh release view latest-apk >/dev/null 2>&1 || \
            gh release create latest-apk --prerelease --title "Build ${{ github.run_number }}" \
              --notes "Rolling build. Install over the previous version; same signing key."
          gh release upload latest-apk daily-learning.apk --clobber
          gh release edit latest-apk --prerelease --title "Build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}. Install over the previous version; same signing key."
